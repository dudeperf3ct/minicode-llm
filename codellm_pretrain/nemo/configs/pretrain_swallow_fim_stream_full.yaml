# Full-scale template for streaming FIM pretraining with NeMo AutoModel.
# Close to torch_titan full defaults; tune distributed launch args per cluster.

seed: 42

step_scheduler:
  global_batch_size: 24
  local_batch_size: 6
  ckpt_every_steps: 5000
  max_steps: 50000

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
    vocab_size: 32768
    max_position_embeddings: 8192

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/swallow_fim_full
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: dataset.swallow_fim_iterable_dataset.SwallowCodeFIMIterableDataset
  hf_config:
    _target_: dataset.swallow_fim_iterable_dataset.HFDatasetConfig
    path: tokyotech-llm/swallow-code-v2
    subset: swallowcode-v2
    split: train
    text_field: improved_code
  seq_len: 8192
  infinite: true
  seed: 42
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: dudeperf3ct/codellm-tokenizer
  fim_config:
    _target_: dataset.swallow_fim_iterable_dataset.FIMConfig
    fim_rate: 0.9
    psm_prob: 0.5
    spm_prob: 0.5
    min_code_length: 64

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  shuffle: true
  shuffle_buffer_size: 10000
  num_workers: 4
  pin_memory: true
  persistent_workers: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 3.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 800
  min_lr: 0.0

clip_grad_norm:
  max_norm: 1.0

wandb:
  project: nemo
  name: full run
