# Step 2 smoke config: streaming FIM pretraining with NeMo AutoModel
# Intended to be close to torch_titan smoke defaults.

seed: 42

step_scheduler:
  global_batch_size: 24
  local_batch_size: 6
  ckpt_every_steps: 200
  max_steps: 1000

dist_env:
  backend: nccl
  timeout_minutes: 5

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  force_hf: true
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
    vocab_size: 32768
    max_position_embeddings: 8192
    bos_token_id: 0
    eos_token_id: 0
    pad_token_id: 0

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/swallow_fim_smoke
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: dataset.swallow_fim_iterable_dataset.SwallowCodeFIMIterableDataset
  hf_config:
    _target_: dataset.swallow_fim_iterable_dataset.HFDatasetConfig
    path: tokyotech-llm/swallow-code-v2
    subset: swallowcode-v2
    split: train
    text_field: improved_code
  seq_len: 8192
  infinite: true
  samples_per_epoch: 2400
  seed: 42
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: dudeperf3ct/codellm-tokenizer
    eos_token: <|endoftext|>
    bos_token: <|endoftext|>
    pad_token: <|endoftext|>
  fim_config:
    _target_: dataset.swallow_fim_iterable_dataset.FIMConfig
    fim_rate: 0.8
    psm_prob: 0.5
    spm_prob: 0.5
    min_code_length: 64

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 6
  drop_last: true
  collate_fn: torch.utils.data.default_collate
  shuffle: true
  shuffle_buffer_size: 10000
  num_workers: 2
  pin_memory: true
  persistent_workers: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 3.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 0.0

clip_grad_norm:
  max_norm: 1.0

wandb:
  project: nemo
  name: smoke run
