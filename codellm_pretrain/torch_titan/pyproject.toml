# template/pyproject.toml.jinja
[project]
name = "codellm_pretrain_torchtitan"
version = "0.1.0"
description = "Pretraining LLM using torchtitan library"
readme = "README.md"
requires-python = ">=3.12, <3.13"
authors = [
    { name = "dudeperf3ct" }
]
dependencies = [
    "transformers>=4.57.1",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.10.0.dev0",
    "torchtitan",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-nightly-cu128", marker = "extra == 'cuda' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

# ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "PERF",   # perflint
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",     # unused arguments ok in tests
    "PLR2004", # magic values ok in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

# pytest coverage configuration
[tool.coverage.run]
source = ["codellm_pretrain"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# typos configuration
[tool.typos.files]
extend-exclude = [".gitignore", "LICENSE"]

# pyrefly configuration
[tool.pyrefly]
python-version = "3.12"
project-excludes = ["**/.[!/.]*", "**/tests", "**/__pycache__"]
project-includes = ["."]
search-path = ["."]
python-interpreter-path = ".venv/bin/python3"
site-package-path = [".venv/lib/python3.12/site-packages"]
disable-search-path-heuristics = true
