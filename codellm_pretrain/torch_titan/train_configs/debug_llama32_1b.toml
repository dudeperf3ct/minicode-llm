# Reference: github.com/pytorch/torchtitan/blob/main/torchtitan/models/llama3/train_configs/debug_model.toml

# Job config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L18
[job]
dump_folder = "./outputs"
description = "Llama 3.2 1B via HuggingFace transformers backend"
print_config = true
custom_config_module = "torchtitan.experiments.transformers_modelling_backend.job_config"

# Profiling config:
[profiling]
enable_profiling = true
save_traces_folder = "profile_trace"
profile_freq = 5
enable_memory_snapshot = true
save_memory_snapshot_folder = "memory_snapshot"

# Metrics config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L74
[metrics]
log_freq = 1
disable_colour_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
save_for_all_ranks = true
enable_wandb = true

# Model config:
[model]
name = "transformers_modelling_backend"
flavour = "debugmodel"
# Note: tokenizer loaded from HuggingFace automatically
# This feature requires torchao. It swaps `torch.nn.Linear` with `Float8Linear for example.
# converters = ["float8"]

[hf_transformers]
model = "meta-llama/Llama-3.2-1B"

# Optimiser config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L134
[optimiser]
name = "AdamW"
lr = 3e-4
eps = 1e-8

# LR scheduler config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L169
[lr_scheduler]
warmup_steps = 2  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.8  # lr scheduler decay ratio, 80% of the train steps
decay_type = "linear"
min_lr_factor = 0.0

# Dataloader config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L201
[training.dataloader]
num_workers = 4
pin_memory = true
persistent_workers = true
prefetch_factor = 2

# Training config: https://github.com/pytorch/torchtitan/blob/81af8833ddeff9b5f1874dc7e20594aa17da6b86/torchtitan/config/job_config.py#L235
[training]
local_batch_size = 8
seq_len = 2048
max_norm = 1.0  # grad norm clipping
steps = 10
dataset = "c4_test"  # supported datasets: c4_test (2K), c4 (177M)
dtype = "bfloat16"
mixed_precision_param = "bfloat16" # only works if when data_parallel_shard_degree > 1 or context_parallel_degree > 1
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default" # default / never / always
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
pipeline_parallel_schedule = "Interleaved1F1B"
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 10
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"  # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "selective"  # ["none", "selective", "full"]
selective_ac_option = '2'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[compile]
enable=true
components = ["model", "loss"]

[quantise.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enable = false
dataset = "c4_validation"
freq = 5
steps = 10
