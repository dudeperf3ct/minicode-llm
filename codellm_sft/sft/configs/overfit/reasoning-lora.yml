base_model: Qwen/Qwen3.5-4B-Base
revision_of_model: 1001bb4d826a52d1f399e183466143f4da7b741b

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
strict: false

chat_template: qwen3_5
eot_tokens:
  - <|im_end|>

datasets:
  - path: dudeperf3ct/qwen35-kodcode-sft-data
    name: reasoning
    revision: db5f9912d76642bac325bea2bb41d83ad186365b
    split: overfit
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    split_thinking: true
    train_on_eos: turn
    train_on_eot: turn

val_set_size: 0
seed: 42
shuffle_merged_datasets: false
dataset_prepared_path: ./prepared/p0-32-reasoning-lora-s42
output_dir: ./outputs/p0-32-reasoning-lora-s42

sequence_len: 16384
excess_length_strategy: raise
sample_packing: false
pad_to_sequence_len: false

micro_batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 100
max_steps: 100

bf16: true
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

attn_implementation: flash_attention_3

optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0001
warmup_ratio: 0.03
weight_decay: 0.0

adapter: lora
load_in_4bit: false
load_in_8bit: false
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: '^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj)|linear_attn\.(?:in_proj_qkv|in_proj_z|out_proj))$'

logging_steps: 1
save_steps: 50

use_wandb: true
wandb_entity: dudeperf3ct
wandb_project: qwen35-4b-kodcode-sft
wandb_name: p0-32-reasoning-lora-s42
