[project]
name = "codellm-sft"
version = "0.1.0"
description = "Supervised fine-tuning experiments for Qwen3.5-4B-Base"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==4.4.1",
    "huggingface-hub==1.23.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.0",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
