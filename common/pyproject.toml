[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for Mini CodeLLM experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==4.4.1",
    "huggingface-hub==1.23.0",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
