[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evals"
version = "0.1.0"
description = "Shared evaluation tools for Mini CodeLLM experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "datasets==4.4.1",
    "httpx==0.28.1",
    "pyyaml>=6.0.0",
    "wandb==0.28.1",
]

[project.scripts]
eval-heldout = "evals.heldout:main"
evalplus-runner = "evals.evalplus:main"

[tool.uv.sources]
common = { path = "../common", editable = true }

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
