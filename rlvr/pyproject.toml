[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr"
version = "0.1.0"
description = "GRPO experiments with verifiable code rewards"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "datasets==4.4.1",
    "evals",
    "huggingface-hub==1.23.0",
    "jinja2>=3.1.6",
    "modal==1.5.4",
    "pyarrow==25.0.0",
    "pyyaml>=6.0.0",
    "transformers==5.14.1",
]

[project.scripts]
rlvr-prepare = "rlvr.data:main"
rlvr-upload = "rlvr.upload:main"
rlvr-verifier-smoke = "rlvr.verifier:main"

[tool.uv.sources]
common = { path = "../common", editable = true }
evals = { path = "../evals", editable = true }

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
