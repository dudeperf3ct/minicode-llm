base_model: Qwen/Qwen3.5-4B-Base
revision_of_model: 1001bb4d826a52d1f399e183466143f4da7b741b
chat_template: qwen3_5
eot_tokens:
  - <|im_end|>

datasets:
  - path: dudeperf3ct/qwen35-kodcode-sft-data
    name: direct
    revision: db5f9912d76642bac325bea2bb41d83ad186365b
    split: overfit
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    split_thinking: false
    train_on_eos: turn
    train_on_eot: turn

val_set_size: 0
seed: 42
shuffle_merged_datasets: false

sequence_len: 16384
excess_length_strategy: raise
sample_packing: false
pad_to_sequence_len: false
train_on_inputs: false

dataset_num_proc: 1
dataset_prepared_path: ./prepared/label-audit/direct
output_dir: ./outputs/label-audit/direct

micro_batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
learning_rate: 0.0001

bf16: true
tf32: true
